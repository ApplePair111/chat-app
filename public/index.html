<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chatroom</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 0;
                display: grid;
                min-height: 100vh;
                grid-template-columns: 220px 1fr;
                grid-template-rows: 1fr auto;
                flex-direction: column;
            }
            nav {
                grid-row: span 2;
                background: rgb(248,249,250);
                border-right: 1px solid #ddd;
            }
            .chat {
                padding: 20px;
                margin: 0;
                display: flex;
                flex-direction: column;
                gap: 10px;
                border-bottom: 1px solid #ddd;
                background: rgb(248,249,250);
            }
            textarea {
                field-sizing: content;
                resize: none;
                max-height: 150px;
            }
            #send {
                margin: 0px;
            }
            .my {
                align-self: flex-end;
            }
            .other {
                align-self: flex-start;
            }
            .message {
                background-color: white;
                border: 1px solid #ddd;
                border-radius: 15px;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <nav></nav>
        <div class="chat"></div>
        <div id="send">
            <textarea></textarea>
            <button onclick="socket.send(JSON.stringify({type: 'message', message: document.querySelector('textarea').value}))">Send</button>
        </div>
        <script>
            const body = document.body;
            const chat = document.querySelector(".chat");
            let socket = new WebSocket((location.protocol === "https:" ? "wss://": "ws://") + location.host + "/ws");
            const params = new URLSearchParams(location.search);
            socket.onopen = () => {
                socket.send(JSON.stringify({type: "name", name: params.get("name")}));
            };
            socket.onmessage = (data) => {
                const json = JSON.parse(data.data);
                if (json.type === "init") {
                    for (const message of json.messages) {
                        const div = document.createElement("div");
                        div.classList.add("message");
                        if (message.name === params.get("name")) {
                            div.classList.add("my");
                        } else {
                            div.classList.add("other");
                        }
                        div.appendChild(document.createTextNode(message.message));
                        chat.appendChild(div);
                    }
                }
                if (json.type === "error") {
                    body.style.display = "flex";
                    body.style.alignItems = "center";
                    body.style.justifyContent = "center";
                    body.replaceChildren();
                    let header = document.createElement("h1");
                    header.innerText = "Error"
                    let text = document.createElement("p");
                    text.style.textAlign = "center";
                    text.innerText = `Connection terminated due to ${json.reason}.\nPlease `;
                    if (json.reason==="screw you.") {
                        text.innerText += "leave this chatroom.";
                    } else {
                        text.innerText += "reload the page and try again.";
                    }
                    body.appendChild(header);
                    body.appendChild(text);

                }
                if (json.type === "message") {
                    const div = document.createElement("div");
                    div.classList.add("message");
                    if (json.message.name === params.get("name")) {
                        div.classList.add("my");
                    } else {
                        div.classList.add("other");
                    }
                    div.appendChild(document.createTextNode(json.message.message));
                    chat.appendChild(div);
                }
            };
        </script>
    </body>
</html>
